b{font-size:12px}.status{font-size:9px;border:1px solid #298573;padding:4px 7px;border-radius:99px;color:#73dbc5}.mock{height:125px;border:1px solid #28505a;border-radius:7px;background:#071721;margin:11px 0;padding:13px}.line{height:6px;background:#21434d;border-radius:5px;margin:7px 0;width:70%}.line.w{width:86%;background:#317e72}.squares{display:flex;gap:6px;margin-top:14px}.squares i{width:24%;height:31px;border:1px solid #276259;background:#11333a;border-radius:4px}.lanefoot{display:flex;justify-content:space-between;color:#6d8991;font-size:9px}.tip{margin-top:12px;border:1px solid #28685f;background:#0e2b31;color:#91d9cb;padding:10px;border-radius:8px;font-size:10px}.checks .row{display:grid;grid-template-columns:23px 1fr auto;align-items:center;gap:8px;border-bottom:1px solid #1d3b47;padding:11px 0;font-size:10px;color:#a9c1c5}.checks .row:last-child{border:0}.circle{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#147b6838;color:#6be0c6}.circle.warn{background:#855d3138;color:#e0aa72}.row button{border:0;background:transparent;color:#69d2be;font-size:9px}.export{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.file{display:flex;align-items:center;gap:8px}.file div{flex:1}.file b{display:block;font-size:10px}.file small{color:#6e8a93;font-size:9px}.right h3{font:10px monospace;letter-spacing:.16em;color:#66838d;margin:0 0 15px}.agent{display:flex;gap:8px;align-items:center;padding:10px 2px;border-bottom:1px solid #1a3540}.agent .ai{width:27px;height:27px;display:grid;place-items:center;border:1px solid #2e5860;border-radius:7px;color:#7fd9c6}.agent b{display:block;font-size:10px}.agent small{display:block;color:#5f7c85;font-size:9px}.state{margin-left:auto;font-size:9px;color:#5bdbc0}.context{margin-top:17px;border:1px solid #20434e;border-radius:8px;padding:10px;color:#82a8a8;font-size:9px}.context div{margin-top:7px;color:#6e9990}@media(max-width:1050px){.layout{grid-template-columns:190px 1fr}.right{display:none}}@media(max-width:760px){.top{padding:0 14px}.meta{display:none}.layout{display:block}.sidebar{display:none}.main{padding:20px 13px}.hero{flex-direction:column;align-items:flex-start}.actions{width:100%;justify-content:space-between}.grid2,.content{grid-template-columns:1fr}.cards,.export{grid-template-columns:1fr}.mods{order:2}.selection{flex-direction:column;align-items:flex-start;gap:8px}.selection .btn{width:100%}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="mark">F</div><div><b>FlowForge</b><small>AI 创作指挥台</small></div></div><div class="meta"><span class="live">● 本地工作区</span><span>版本 V0.1 · 草稿</span></div></header><div class="layout"><aside class="sidebar"><div class="caption">WORKFLOW</div><nav class="nav" id="nav"></nav><div class="sidefoot">● 运行中 Agent：<b id="runCount">0</b><br><br>每一步都可暂停、回滚和局部返工。</div></aside><main class="main"><div class="hero"><div><div class="eyebrow" id="eyebrow">START HERE</div><h1 id="title">题目解析</h1><p id="subtitle">拆出约束与评分点，再启动两路并行分析。</p></div><div class="actions"><span class="pill">剩余建议时间 25:00</span><button class="btn primary" id="start">▶ 启动工作流</button></div></div><div id="view"></div></main><aside class="right"><h3>AGENT CONTROL</h3><div id="agents"></div><div class="context">▣ 查看共享上下文包<div>✓ 原始题目<br>✓ 硬约束与评分点<br>✓ STEP 2–5 模板<br>✓ 用户偏好：新奇 / 互动</div></div></aside></div></div><script>
const phases=[['brief','题目解析','拆出约束与评分点'],['content','文字方案','生成 STEP 2–5 全部模块'],['creative','创意形式','比较可交付表达方式'],['production','并行制作','多条作品赛道独立运行'],['review','一致性检查','发现矛盾并定位模块'],['export','导出交付','冻结版本并输出文件']];let phase='brief',confirmed=false,selected=[],active='s2',agentState={coord:'待命',content:'待命',creative:'待命'};
const modules={s2:['S2','思考脑图','选择理由与反向理由在同一张脑图中',`# 旧手机拆解工作坊救场\n\n## 核心目标\n让40名零基础参与者完成“断电—拆解—分类—复述”的安全闭环。\n\n## 三类冲突\n- 容量：120人 > 40席 → 拥挤、等待，无法保证每人动手。\n- 物料：25套 < 40人 → 双人协作并保留备用。\n- 教学：2人中仅1人熟练 → 复杂讲授难复制，安全风险上升。\n\n## 主题选择：A｜优先保住现场体验\n### 选择理由\n零基础+两天倒计时下，安全和真正动手是不可逆的核心价值；A能把B的物料约束和C的人力短板吸收为轮换、脚本和分流动作。\n\n### 反向理由\n- B不作为主目标：只优化25套材料和300元，仍无法解决120→40的容量矛盾；过度轮换会让参与者只看不做。\n- C不作为主目标：两天内招募和培训新讲师不确定，未经演练的讲解员可能放大电池与尖锐件风险。\n\n## 决策闭环\n40席双人轮换 + 20套启用/5套备用 + 固定安全脚本 + 80人候补出口。`],s3:['S3','方案六要素','用户、痛点、路径、工具、效果、风险',`用户画像：40名零基础现场参与者；80名候补者需要公平出口。\n\n核心痛点：人数是容量3倍、材料不足以一人一套、指导人手不足，三者叠加会造成等待和安全事故。\n\n解决路径：40人分20组双人轮换，启用20套、封存5套；负责人抓安全与异常，学弟按脚本复述、计时和记录。\n\nAI工具选型：ChatGPT做约束拆解与表达压缩；单文件HTML做救场控制台。\n\n预期效果：至少36人完成闭环，危险件100%隔离，80名候补者收到预习包。\n\n风险应对：出现鼓包、发热、液体泄漏或断电不明，立即红牌停桌；前提不成立时降级至24人。`],s4:['S4','作品与 AI 记录','说明做了什么、用什么做、如何迭代',`作品链接：本地单文件HTML\n\n一句话介绍：把120人的失控报名重排成40人可完成、可验收的安全拆解闭环。\n\nAI工具名称：ChatGPT；HTML/CSS/JavaScript\n\n首条Prompt：请把旧手机拆解工作坊的容量、物料、教学冲突转化成一个有互动的现场救场控制台。\n\n不满意之处：第一版信息密度高，现场演练路径不够突出。\n\n迭代逻辑：先加阶段导航，再加计时器、约束雷达和正常线/降级线切换。\n\n个人介绍：我习惯先列硬约束，再用主目标、辅助措施和止损线组织方案。`],s5:['S5','最终复盘','四个问题与成长型反思',`最满意的地方：把“120人无法全部参加”转化为明确分流，同时守住安全和动手机会。\n\n最想改变的：提前完成20组压力演练，用真实用时验证四区轮换。\n\n再给25分钟会做：记录每组用时、讲解错误和危险件出现频率，再调整轮换顺序。\n\n想问面试官：25套材料是否都能安全断电？场地能否布置20个双人位？若一项不成立，我会启用24人最低运行线。`]};
const creatives=[['a4','▦','A4 救场指挥台','约束、流程和止损线做成一页可点击控制台',1,10,['阶段导航','打印模式']],['sim','⌁','约束决策模拟器','拖动人数、材料和指导员，实时看方案是否越过红线',3,18,['参数滑杆','风险事件卡']],['game','✦','90分钟救场任务卡','把负责人行动拆成六个关卡，完成后解锁安全闭环',4,24,['关卡解锁','资源徽章']],['story','◌','候补者公平出口故事板','用40人与80人的双轨故事呈现取舍',2,14,['双轨切换','时间轴']]];
function nav(){document.getElementById('nav').innerHTML=phases.map((p,i)=>`<button class="${phase===p[0]?'active':''}" onclick="go('${p[0]}')"><span class="num">${String(i+1).padStart(2,'0')}</span><span><b>${p[1]}</b><small>${p[2]}</small></span><span>›</span></button>`).join('')}
function agents(){let rows=[['◈','编排 Agent','TaskBrief / 依赖管理',agentState.coord],['▤','文字 Agent','STEP 2–5 全模块',agentState.content],['✦','创意导演 Agent','形式候选 / 难度排序',agentState.creative]];document.getElementById('agents').innerHTML=rows.map(a=>`<div class="agent"><span class="ai">${a[0]}</span><span><b>${a[1]}</b><small>${a[2]}</small></span><span class="state">${a[3]}</span></div>`).join('');document.getElementById('runCount').textContent=Object.values(agentState).filter(x=>x==='运行中').length}
function go(p){phase=p;nav();let names=Object.fromEntries(phases.map(x=>[x[0],x[1]]));document.getElementById('title').textContent=names[p];document.getElementById('eyebrow').textContent=p==='brief'?'START HERE':`STAGE ${phases.findIndex(x=>x[0]===p)+1}`;document.getElementById('subtitle').textContent=phases.find(x=>x[0]===p)[2];render()}
function render(){let v=document.getElementById('view');if(phase==='brief')v.innerHTML=`<div class="grid2"><section class="card"><div class="eyebrow">INPUT / 01</div><h2>把题目交给编排 Agent</h2><textarea class="textarea" id="task">校园创客社团两天后要办一场零基础旧手机拆解与电子元件回收工作坊。原计划40人，实际报名120人，场地只能容纳40人，材料仅够25套，预算只剩300元，两名现场指导临时退出，只剩负责人和一名没讲过课的学弟。请完成拆解理解、方向选择、1页方案、取舍边界、自我说明和一致性自证。A现场体验，B材料预算，C教学人力。</textarea><div class="foot"><span>支持完整题目、规则和附件说明</span><button class="btn" onclick="parse()">◎ 解析题目</button></div></section><section class="card"><div class="eyebrow">TASK BRIEF</div><h2>解析后的任务卡</h2><div class="item"><b>硬约束</b><div class="tags"><span class="tag">120人报名</span><span class="tag">40席上限</span><span class="tag">25套材料</span><span class="tag">¥300预算</span></div></div><div class="item"><b>评分关注</b><p>拆解 · 取舍 · 执行 · 一致性 · AI协作 · 复盘</p></div><div class="item"><b>交付限制</b><p>STEP 2–5 文字 + 可选 HTML / 图片作品</p></div>${confirmed?'<div class="ok">✓ 约束已确认，可以启动并行 Agent</div>':''}</section></div>`;else if(phase==='content')v.innerHTML=contentView();else if(phase==='creative')v.innerHTML=creativeView();else if(phase==='production')v.innerHTML=productionView();else if(phase==='review')v.innerHTML=reviewView();else v.innerHTML=exportView()}
function parse(){confirmed=true;document.getElementById('start').disabled=false;render()}function contentView(){return `<div class="content"><section class="card mods"><div class="eyebrow">CONTENT WORKSPACE</div><h2>STEP 2–5 全部文字</h2><p style="color:var(--muted);font-size:10px">STEP 2 的选择理由与反向理由已收进“思考脑图”。</p>${Object.entries(modules).map(([id,m])=>`<button class="mod ${active===id?'sel':''}" onclick="active='${id}';render()"><span>${m[0]}</span><span><b>${m[1]}</b><small>${m[2]}</small></span><span>›</span></button>`).join('')}</section><section><div class="card"><div class="eyebrow">${modules[active][0]} / EDITOR</div><h2>${modules[active][1]}</h2><textarea class="textarea editor">${modules[active][3]}</textarea><div class="foot"><span>✓ 仅保存当前模块版本</span><span>未选模块不会被改写</span></div></div><div class="card prompt"><div class="eyebrow">LOCAL PATCH · 当前范围：${modules[active][1]}</div><h2>输入提示词改良模块</h2><textarea class="textarea" id="patch" placeholder="例如：更像负责人决策，增加两天倒计时和安全风险的因果关系。"></textarea><button class="btn primary" onclick="patch()">✦ 生成补丁</button><div class="quick">快速提示 <button onclick="document.getElementById('patch').value='更具体，增加可量化指标'">更具体</button><button onclick="document.getElementById('patch').value='更像本人表达，减少模板化语言'">更像本人</button><button onclick="document.getElementById('patch').value='压缩成考官30秒可读版本'">更精简</button></div></div></section></div>`}
function patch(){let p=document.getElementById('patch').value.trim();if(!p)return;if(!modules[active][3].includes('【本轮改良】'))modules[active][3]+='\n\n【本轮改良】'+p;render()}
function creativeView(){return `<div class="creative-head"><div><div class="eyebrow">CREATIVE DIRECTOR</div><h2>创作形式候选池</h2><p>按制作难度从低到高排列，点击卡片进行多选。</p></div><span class="pill">已选 ${selected.length} 个</span></div><div class="cards">${creatives.map(x=>`<article class="card creative ${selected.includes(x[0])?'sel':''}" onclick="toggle('${x[0]}')"><div class="topline"><span class="icon">${x[1]}</span><span class="diff">难度 ${x[4]}/5</span></div><h3>${x[2]}</h3><p>${x[3]}</p><div class="chips">${x[6].map(y=>`<span>${y}</span>`).join('')}</div><div class="meta"><span>◷ 约 ${x[5]} 分钟</span><span>${selected.includes(x[0])?'✓ 已选择':'点击选择'}</span></div></article>`).join('')}</div><div class="selection"><div><b>已选 ${selected.length} 个方案</b><span>${selected.length?'可创建独立制作赛道，最多并行2个':'至少选择一个形式进入制作'}</span></div><button class="btn primary" onclick="go('production')" ${selected.length?'':'disabled'}>创建制作赛道 →</button></div>`}
function toggle(id){selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];render()}
function productionView(){let list=selected.length?creatives.filter(x=>selected.includes(x[0])):creatives.slice(0,2);return `<div class="creative-head"><div><div class="eyebrow">PRODUCTION LANES</div><h2>并行制作赛道</h2><p>每个作品独立版本，可继续输入提示词优化。</p></div><span class="pill">2 并发 / ${list.length} 总任务</span></div>${list.map((x,i)=>`<article class="card lane"><div class="lanehead"><b>${x[2]}</b><span class="status">${i?'排队中':'制作中 68%'}</span></div><div class="mock"><div class="line w"></div><div class="line"></div><div class="squares"><i></i><i></i><i></i></div></div><div class="lanefoot"><span>文字版本 V1 · artifact_${x[0]}_v1.html</span><button class="btn" onclick="alert('已打开作品优化器：可输入“增加游戏感，但保持文字不变”等 Prompt，生成 V2。')">✦ 优化作品</button></div></article>`).join('')}<div class="tip">✦ <b>作品优化循环：</b>生成 V2/V3 前后对比，用户接受后才覆盖当前版本；文字模块默认保持不变。</div>`}
function reviewView(){return `<div class="creative-head"><div><div class="eyebrow">CONSISTENCY REVIEW</div><h2>一致性检查</h2><p>问题定位到具体模块，不会自动重写整篇答案。</p></div><span class="pill">5 / 5 通过</span></div><section class="card checks">${['STEP 2 思考脑图包含选择理由与 B/C 反向理由','STEP 3 六要素完整','STEP 4 有 AI 工具与迭代记录','作品与主攻方向一致','明确边界与降级方案'].map(x=>`<div class="row"><span class="circle">✓</span><span>${x}</span><button>查看 ›</button></div>`).join('')}</section>`}
function exportView(){return `<section class="card" style="display:flex;align-items:center;gap:12px"><span class="icon">✓</span><div><div class="eyebrow">READY TO SHIP</div><h2 style="margin:5px 0">可以冻结最终版本</h2><span style="color:var(--muted);font-size:10px">文字 V1 · 作品 ${selected.length||1} 条赛道 · STEP 2–5 完整</span></div><button class="btn primary" style="margin-left:auto" onclick="alert('已冻结 V1（原型演示）')">冻结版本</button></section><div class="export" style="margin-top:12px">${[['▤','完整文字答案.md','STEP 2–5 全部模块'],['✦','主作品.html','受限 iframe 预览'],['□','项目包.zip','文字、作品、Prompt、版本记录']].map(x=>`<div class="card file"><span class="icon">${x[0]}</span><div><b>${x[1]}</b><small>${x[2]}</small></div><button class="btn">导出</button></div>`).join('')}</div>`}
document.getElementById('start').onclick=()=>{if(!confirmed)return alert('请先点击“解析题目”确认约束');agentState={coord:'完成',content:'运行中',creative:'运行中'};agents();setTimeout(()=>{agentState={coord:'完成',content:'完成',creative:'完成'};agents();go('content')},700)};nav();agents();render();
</script>
<script>
(function(){
  const css=`.settings-btn{border:1px solid #2c5260;background:#0f2935;color:#a7c5ca;border-radius:7px;padding:7px 9px;font-size:10px;cursor:pointer}.settings-btn.ready{border-color:#2e9d88;color:#64ddc3}.modal-backdrop{position:fixed;inset:0;background:#020b12c7;display:none;align-items:center;justify-content:center;z-index:20;padding:18px}.modal-backdrop.open{display:flex}.modal{width:min(520px,100%);background:#0d202c;border:1px solid #2d5964;border-radius:12px;padding:18px;box-shadow:0 25px 70px #0008}.modal-head{display:flex;justify-content:space-between;align-items:flex-start}.modal-head h2{margin:4px 0;font-size:17px}.modal-head p{color:var(--muted);font-size:10px;margin:0}.close{border:0;background:transparent;color:#7d9ba3;font-size:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{color:#8caab1;font-size:10px}.field input,.field select{background:#071721;border:1px solid #20505c;color:#d3e5e6;border-radius:6px;padding:9px;font-size:11px;outline:none}.field input:focus,.field select:focus{border-color:var(--teal)}.modal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.api-msg{font-size:10px;color:#7fd7c4}.api-msg.error{color:var(--red)}.artifact-prompt{display:flex;gap:7px;margin-top:9px}.artifact-prompt input{flex:1;background:#071721;border:1px solid #20505c;color:#cfe2e4;border-radius:6px;padding:8px;font-size:10px}.artifact-frame{width:100%;height:180px;border:0;background:white;border-radius:6px}`;
  const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
  let apiConfig={baseUrl:'https://api.openai.com/v1',apiKey:'',model:'',temperature:0.4};
  try{apiConfig={...apiConfig,...JSON.parse(localStorage.getItem('flowforge_api_config')||'{}')}}catch{}
  const meta=document.querySelector('.top .meta');
  const settingsBtn=document.createElement('button');settingsBtn.className='settings-btn';settingsBtn.id='apiSettingsBtn';settingsBtn.onclick=()=>window.openSettings();meta.appendChild(settingsBtn);
  const modal=document.createElement('div');modal.className='modal-backdrop';modal.id='apiModal';modal.innerHTML=`<section class="modal"><div class="modal-head"><div><div class="eyebrow">MODEL ADAPTER</div><h2>API 设置</h2><p>支持 OpenAI-compatible Chat Completions 接口</p></div><button class="close" onclick="closeSettings()">×</button></div><div class="form-grid"><div class="field full"><label>Base URL</label><input id="apiBase" placeholder="https://api.openai.com/v1"></div><div class="field full"><label>API Key</label><input id="apiKey" type="password" autocomplete="off" placeholder="仅保存在当前浏览器"></div><div class="field"><label>Model</label><input id="apiModel" placeholder="gpt-4.1-mini"></div><div class="field"><label>Temperature</label><input id="apiTemp" type="number" min="0" max="2" step="0.1"></div></div><div class="modal-foot"><span class="api-msg" id="apiMsg">配置只保存在本机 localStorage</span><div><button class="btn" onclick="testApi()">测试连接</button> <button class="btn primary" onclick="saveApi()">保存配置</button></div></div></section>`;document.body.appendChild(modal);
  function paintApi(){settingsBtn.textContent=apiConfig.model?'● API '+apiConfig.model:'⚙ API 设置';settingsBtn.classList.toggle('ready',Boolean(apiConfig.model&&apiConfig.baseUrl));}
  window.openSettings=()=>{document.getElementById('apiBase').value=apiConfig.baseUrl||'';document.getElementById('apiKey').value=apiConfig.apiKey||'';document.getElementById('apiModel').value=apiConfig.model||'';document.getElementById('apiTemp').value=String(apiConfig.temperature??0.4);modal.classList.add('open')};
  window.closeSettings=()=>modal.classList.remove('open');
  function readApi(){return{baseUrl:document.getElementById('apiBase').value.trim().replace(/\/$/,''),apiKey:document.getElementById('apiKey').value.trim(),model:document.getElementById('apiModel').value.trim(),temperature:Number(document.getElementById('apiTemp').value||0.4)}}
  window.saveApi=()=>{const next=readApi();if(!next.baseUrl||!next.model)return showApi('Base URL 和 Model 不能为空',true);apiConfig=next;localStorage.setItem('flowforge_api_config',JSON.stringify(apiConfig));paintApi();showApi('已保存，可以关闭窗口');};
  function showApi(text,error=false){const el=document.getElementById('apiMsg');el.textContent=text;el.classList.toggle('error',error)}
  async function request(path,options={}){const base=(apiConfig.baseUrl||'').replace(/\/$/,'');const headers={...(options.headers||{}),'Content-Type':'application/json'};if(apiConfig.apiKey)headers.Authorization='Bearer '+apiConfig.apiKey;const res=await fetch(base+path,{...options,headers});const raw=await res.text();let body;try{body=JSON.parse(raw)}catch{body={raw}}if(!res.ok)throw new Error(body?.error?.message||body?.message||`HTTP ${res.status}`);return body}
  window.testApi=async()=>{const draft=readApi();apiConfig=draft;showApi('正在连接…');try{await request('/models');showApi('连接成功，模型接口可访问')}catch(e){showApi('连接失败：'+e.message,true)}};
  async function callModel(system,user){if(!apiConfig.baseUrl||!apiConfig.model)throw new Error('请先配置 Base URL 和 Model');const body=await request('/chat/completions',{method:'POST',body:JSON.stringify({model:apiConfig.model,temperature:apiConfig.temperature,messages:[{role:'system',content:system},{role:'user',content:user}]})});const text=body?.choices?.[0]?.message?.content;if(!text)throw new Error('模型没有返回文本内容');return text}
  const offlinePatch=window.patch;
  window.patch=async()=>{const el=document.getElementById('patch');const p=el?.value.trim();if(!p)return;if(!apiConfig.model){offlinePatch();return}const button=el.parentElement.querySelector('.primary');const old=button.textContent;button.disabled=true;button.textContent='生成中…';try{const result=await callModel('你是结构化面试答案编辑 Agent。只改写给定模块，不添加说明，不改动其他模块。STEP 2 中选择理由和反向理由必须保留在思考脑图内部。',`模块：${modules[active][1]}\n当前内容：\n${modules[active][3]}\n\n改良要求：${p}`);modules[active][3]=result;render()}catch(e){alert('API 调用失败，已保留原文：'+e.message)}finally{button.disabled=false;button.textContent=old}};
  const artifactVersions={};
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  window.optimizeArtifact=async(id)=>{const input=document.getElementById('artPrompt_'+id);const prompt=input.value.trim();if(!prompt)return alert('请输入作品优化提示词');const item=creatives.find(x=>x[0]===id);const state=artifactVersions[id]||(artifactVersions[id]={version:1,html:''});if(!apiConfig.model){state.version++;alert(`离线演示：已创建 V${state.version} 优化任务。配置 API 后可生成真实 HTML。`);render();return}input.disabled=true;try{const context=Object.values(modules).map(m=>`${m[1]}\n${m[3]}`).join('\n\n');const html=await callModel('你是高级前端作品制作 Agent。返回完整、可直接保存的单文件 HTML，不要使用 Markdown 代码围栏，不要修改题目的核心立场。',`作品形式：${item[2]}\n创意说明：${item[3]}\n当前文字：\n${context}\n\n本轮优化：${prompt}`);state.html=html.replace(/^```html\s*|```$/g,'').trim();state.version++;render()}catch(e){alert('作品优化失败，原版本未覆盖：'+e.message)}finally{input.disabled=false}};
  window.productionView=()=>{let list=selected.length?creatives.filter(x=>selected.includes(x[0])):creatives.slice(0,2);return `<div class="creative-head"><div><div class="eyebrow">PRODUCTION LANES</div><h2>并行制作赛道</h2><p>每个作品独立版本，可继续输入提示词优化。</p></div><span class="pill">2 并发 / ${list.length} 总任务</span></div>${list.map((x,i)=>{const st=artifactVersions[x[0]]||{version:1,html:''};return `<article class="card lane"><div class="lanehead"><b>${x[2]}</b><span class="status">V${st.version} · ${st.html?'已生成':i?'排队中':'待优化'}</span></div>${st.html?`<iframe class="artifact-frame" sandbox="allow-scripts" srcdoc="${esc(st.html)}"></iframe>`:`<div class="mock"><div class="line w"></div><div class="line"></div><div class="squares"><i></i><i></i><i></i></div></div>`}<div class="lanefoot"><span>文字版本 V1 · artifact_${x[0]}_v${st.version}.html</span></div><div class="artifact-prompt"><input id="artPrompt_${x[0]}" placeholder="例如：增加游戏感，但保持文字内容不变"><button class="btn" onclick="optimizeArtifact('${x[0]}')">✦ 优化作品</button></div></article>`}).join('')}<div class="tip">✦ <b>版本安全：</b>每次优化生成新版本；调用失败不会覆盖当前作品。API Key 仅存于本机浏览器。</div>`};
  modal.addEventListener('click',e=>{if(e.target===modal)window.closeSettings()});paintApi();
})();
</script></body></html>
